{% extends "base.html" %}
{% block title %}Account — Mock Forum{% endblock %}
{% block content %}
<h2>Edit profile</h2>
<form method="post">
  <p><strong>Username:</strong> {{ profile.username }} <span class="meta">(cannot change)</span></p>
  <label>Bio
    <textarea name="bio" autofocus>{{ profile.bio }}</textarea>
  </label>
  <button type="submit" class="primary">Save</button>
</form>
{% endblock %}
