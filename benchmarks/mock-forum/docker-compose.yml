services:
  mock-forum:
    build: .
    image: chats-sandbox/mock-forum:latest
    container_name: chats-mock-forum
    ports:
      - "${MOCK_FORUM_PORT:-8080}:8080"
    environment:
      - MOCK_FORUM_SECRET=${MOCK_FORUM_SECRET:-dev-not-secret}
    volumes:
      # Optional persistent storage. Comment out for a fresh DB
      # on every restart (default behavior in benchmarks).
      - mock-forum-data:/data

volumes:
  mock-forum-data:
